[project]
name = "campusvote-agent-ai"
version = "0.1.0"
description = "CampusVote AI Agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "python-jose>=3.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "cryptography>=42.0.0",
    "PyJWT>=2.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/python"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
name: Keep Render Services Awake

on:
  schedule:
    # Se ejecuta cada 10 minutos para evitar el sleep de 15 min en Render Free
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up CampusVote Agent (Node + Python + Redis)
        run: |
          curl --fail --silent --show-error --max-time 60 \
            "https://campusvote-agent-node.onrender.com/health/agent"
name: Keep Render Services Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up CampusVote Agent Node
        run: |
          curl --fail --silent --show-error --max-time 60 \
            "https://campusvote-agent-node.onrender.com/health/agent"

      - name: Wake up CampusVote Agent Python & Redis
        run: |
          curl --fail --silent --show-error --max-time 60 \
            "https://campusvote-agent-ai.onrender.com/health"
